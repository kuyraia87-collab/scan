<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scan Payment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      /* พื้นหลังไล่สี */
      background: linear-gradient(
        135deg,
        #7b001c,
        #b3123d,
        #5c0015
      );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    img {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;

      border-radius: 16px;

      /* เงาให้รูปเด่นขึ้น */
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>

<body>

  <img
    src="./pay.jpg"
    alt="QR Code สำหรับชำระเงิน"
  >

</body>

</html>
